[build]
# target-dir 不设置，使用 cargo 默认路径 rust-lib/target/
# （原 D:/appflow/cache/cargo-target 为 Windows 专用路径，macOS 上会引起冒号解析错误）

[alias]
# 清理 Android 交叉编译缓存的快捷命令
# 用法: cargo android-clean
android-clean = "clean --target aarch64-linux-android --target x86_64-linux-android"

[target.x86_64-apple-darwin]
#rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-mmacosx-version-min=11.0"]
rustflags = ["-C", "link-arg=-mmacosx-version-min=11.0"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=11.0"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-miphoneos-version-min=10.0"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-miphoneos-version-min=10.0"]

# Android 交叉编译不要在这里写死 linker / sysroot。
# 原先的 [target.aarch64-linux-android] / [target.x86_64-linux-android] 指向
# D:/Android/.../windows-x86_64/bin/clang.exe（Windows 专用），在 macOS 上
# 调用 cargo-ndk 会直接报 linker not found / cannot open crtbegin_so.o。
# 现在统一由 cargo-ndk 依据 ANDROID_NDK_HOME 注入 linker、sysroot 与
# --target=<triple><api>，Windows / macOS / Linux 都能用同一份配置。
# 如需额外链接参数，请用 CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS 等环境变量。
