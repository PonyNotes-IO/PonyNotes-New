org.gradle.jvmargs=-Xmx8G -Xms4G -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.enabled=false
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=36
# Gradle 8.11.1 / AGP 8.6.0 不支持在 Java 25 上运行（settings.gradle 解析
# flutter-plugin-loader 插件时报 "Error resolving plugin ... > 25.0.4"，
# 那个数字就是 JBR 的 Java 版本）。必须固定为 JDK 17。
# 其他机器请把此行改成本机 JDK 17 路径；或删除本行并在 IDE 的
# "Gradle JDK" 设置里选择 17 / 用 JAVA_HOME 指向 JDK 17。
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
kotlin.daemon.enabled=false

# media_kit: 走 ghfast.top 镜像下载 libmpv JAR，避免国内访问 GitHub Releases 失败
# flutter clean 后构建会自动重新下载，无需手动干预
mediaKitDownloadBaseUrl=https://ghfast.top/https://github.com
mediaKitAndroidAbis=arm64-v8a