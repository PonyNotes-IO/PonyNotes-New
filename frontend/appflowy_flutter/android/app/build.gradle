plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def targetAbis = (findProperty('androidAbis') ?: 'arm64-v8a,armeabi-v7a').split(',').toList()
def cargoTargetPlatforms = targetAbis.collect { it == 'arm64-v8a' ? 'android-arm64' : 'android-arm' }.join(',')

android {
    namespace 'com.xiaomabiji.app.note'
    compileSdk = flutter.compileSdkVersion
    // 与云构建一致：云 workflow 不改这个值，直接用 Flutter 自带的 ndkVersion（3.35.x = 27.0.12077973）
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            jniLibs.srcDirs += [
                    'libs',
                    'jniLibs'
            ]
        }
        debug.jniLibs.srcDir "${rootProject.buildDir}/super_native_extensions/jniLibs/debug"
        profile.jniLibs.srcDir "${rootProject.buildDir}/super_native_extensions/jniLibs/profile"
        release.jniLibs.srcDir "${rootProject.buildDir}/super_native_extensions/jniLibs/release"
    }

    // Exclude emulator ABIs while retaining both 64-bit and 32-bit ARM libraries.
    packaging {
        jniLibs {
            excludes += (['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'] - targetAbis)
                    .collect { abi -> "lib/${abi}/**" }
        }
    }

    defaultConfig {
        applicationId "com.xiaomabiji.app.note"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
        }
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
        }
    }

}

flutter {
    source '../..'
}

// These CargoKit versions do not reliably export their native libraries with
// modern Flutter Gradle on Windows. If either library is missing, automatic
// plugin registration aborts before permission_handler is registered.
def cargoNativePlugins = [
        [
                projectName: 'irondash_engine_context',
                taskName: 'IrondashEngineContext',
                libraryName: 'irondash_engine_context_native',
                manifestPath: 'android/rust',
        ],
        [
                projectName: 'super_native_extensions',
                taskName: 'SuperNativeExtensions',
                libraryName: 'super_native_extensions',
                manifestPath: 'rust',
        ],
]

['Debug': 'debug', 'Profile': 'profile', 'Release': 'release'].each { variantName, buildMode ->
    cargoNativePlugins.each { config ->
        def nativeProject = project(":${config.projectName}")
        def nativeRoot = nativeProject.projectDir.parentFile
        def nativeBuildDir = new File(rootProject.buildDir, config.projectName)
        def nativeLibraries = targetAbis.collect { abi ->
            new File(nativeBuildDir, "jniLibs/${buildMode}/${abi}/lib${config.libraryName}.so")
        }
        def buildNativeLibrary = tasks.register(
                "build${config.taskName}${variantName}NativeLibrary",
                Exec
        ) {
            def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
            def runner = new File(
                    nativeRoot,
                    "cargokit/${isWindows ? 'run_build_tool.cmd' : 'run_build_tool.sh'}"
            )
            workingDir(nativeProject.projectDir)
            executable(runner)
            args('build-gradle')
            environment('FLUTTER_ROOT', localProperties.getProperty('flutter.sdk'))
            environment('CARGOKIT_ROOT_PROJECT_DIR', rootProject.projectDir)
            environment('CARGOKIT_TOOL_TEMP_DIR', "${nativeBuildDir}/build/build_tool")
            environment('CARGOKIT_MANIFEST_DIR', new File(nativeRoot, config.manifestPath))
            environment('CARGOKIT_CONFIGURATION', buildMode)
            environment('CARGOKIT_TARGET_TEMP_DIR', "${nativeBuildDir}/build")
            environment('CARGOKIT_OUTPUT_DIR', "${nativeBuildDir}/jniLibs/${buildMode}")
            environment('CARGOKIT_NDK_VERSION', android.ndkVersion)
            environment('CARGOKIT_SDK_DIR', android.sdkDirectory)
            environment('CARGOKIT_COMPILE_SDK_VERSION', flutter.compileSdkVersion)
            environment('CARGOKIT_MIN_SDK_VERSION', flutter.minSdkVersion)
            environment('CARGOKIT_TARGET_PLATFORMS', cargoTargetPlatforms)
            environment('CARGOKIT_JAVA_HOME', System.properties['java.home'])
            // CargoKit uses encoded flags; RUSTFLAGS would be overridden by its NDK setup.
            environment('CARGO_ENCODED_RUSTFLAGS',
                    [System.getenv('CARGO_ENCODED_RUSTFLAGS'), '-C', 'link-arg=-Wl,-z,max-page-size=16384']
                            .findAll { it }.join('\u001f'))
            doFirst {
                if (!runner.exists()) {
                    throw new GradleException("Missing CargoKit runner: ${runner}")
                }
                if (!isWindows) {
                    runner.setExecutable(true)
                }
            }
            doLast {
                def missingLibraries = nativeLibraries.findAll { !it.exists() }
                if (!missingLibraries.isEmpty()) {
                    throw new GradleException(
                            "Missing Android native plugin libraries: ${missingLibraries.join(', ')}"
                    )
                }
            }
        }
        tasks.matching { it.name == "merge${variantName}JniLibFolders" }.configureEach {
            dependsOn(buildNativeLibrary)
        }
    }
}

// The irondash plugin's own CargoKit task is redundant with the deterministic
// app task above and otherwise tries unused emulator targets in debug.
gradle.projectsEvaluated {
    ['Debug', 'Profile', 'Release'].each { variantName ->
        project(':irondash_engine_context').tasks
                .findByName("cargokitCargoBuildIrondash_engine_context_native${variantName}")
                ?.enabled = false
    }
}

// Release builds must keep Flutter's generated plugin registration. This guard
// also protects direct Gradle builds that bypass the cargo-make preflight.
def verifyFlutterPluginRegistration = tasks.register('verifyFlutterPluginRegistration') {
    doLast {
        def mainActivityFile = file('src/main/kotlin/com/xiaomabiji/app/note/MainActivity.kt')
        if (!mainActivityFile.exists()) {
            throw new GradleException("Missing MainActivity.kt: ${mainActivityFile}")
        }

        def mainActivity = mainActivityFile.getText('UTF-8')
        if (!mainActivity.contains('super.configureFlutterEngine(flutterEngine)')) {
            throw new GradleException(
                    'MainActivity must call super.configureFlutterEngine(flutterEngine) to keep Flutter automatic plugin registration.'
            )
        }
        if (mainActivity ==~ /(?s).*flutterEngine(?:\.getPlugins\(\)|\.plugins)\.add\s*\(.*/) {
            throw new GradleException(
                    'MainActivity contains manual plugin registration. Keep plugin registration in GeneratedPluginRegistrant.java.'
            )
        }

        def registrantFile = file('src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java')
        if (!registrantFile.exists()) {
            throw new GradleException(
                    "Missing GeneratedPluginRegistrant.java. Run flutter pub get before the release build: ${registrantFile}"
            )
        }

        def proguardFile = file('proguard-rules.pro')
        if (!proguardFile.exists()) {
            throw new GradleException("Missing Android release keep rules: ${proguardFile}")
        }

        def registrant = registrantFile.getText('UTF-8')
        def proguard = proguardFile.getText('UTF-8')
        def requiredRegistrations = [
                'com.pichillilorenzo.flutter_inappwebview_android.InAppWebViewFlutterPlugin',
                'com.postliu.douyin_login.DouyinPlugin',
                'com.jarvan.fluwx.FluwxPlugin',
                'dev.fluttercommunity.plus.device_info.DeviceInfoPlusPlugin',
                'io.flutter.plugins.imagepicker.ImagePickerPlugin',
                'com.baseflow.permissionhandler.PermissionHandlerPlugin',
                'com.jarvan.tobias.TobiasPlugin',
        ]
        requiredRegistrations.each { registration ->
            if (!registrant.contains(registration)) {
                throw new GradleException(
                        "GeneratedPluginRegistrant.java is missing required Android plugin registration: ${registration}"
                )
            }
            if (!proguard.contains("-keep class ${registration} {")) {
                throw new GradleException(
                        "Android release keep rules are missing required plugin entry point: ${registration}"
                )
            }
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(verifyFlutterPluginRegistration)
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // 微信 SDK：6.8.38（最新稳定版）
    // Android 14/15 的 PendingIntent BAL opt-in 应由 SDK 6.8.34+ 内置处理，
    // 因此我们改回用 wxApi.sendReq() 走 SDK 内部的 MMessageActV2 流程，不再手动绕过。
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.38'
}
